<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" role="img" aria-labelledby="title desc"><title id="title">Conceptual SME review screen</title><desc id="desc">Initial UX proposal. Three panels show claim notes, selected source words, and a detail form allowing no owner. A claim dossier retains existing entities and unassigned details separately.</desc><rect width="100%" height="100%" fill="#f4f7fb"/><g font-family="Segoe UI, Arial, sans-serif"><text x="32" y="45" font-size="28" fill="#20334b" font-weight="700">SME review • capture first, resolve ownership when evidence permits</text><text x="32" y="77" font-size="16" fill="#526881" font-weight="400">INITIAL CONCEPT — for UX review; not a released application screen</text><rect x="32" y="104" width="1376" height="66" rx="12" fill="#173954" stroke="#173954"/><text x="54" y="146" font-size="23" fill="#ffffff" font-weight="700">Claim 123456-123456-AA-01</text><text x="730" y="146" font-size="18" fill="#ffffff" font-weight="400">1  Read notes     →     2  Review claim     →     3  Compare</text><rect x="32" y="190" width="264" height="490" rx="12" fill="#ffffff" stroke="#d4ddea"/><text x="52" y="226" font-size="22" fill="#20334b" font-weight="700">Claim notes</text><text x="52" y="269" font-size="17" fill="#20334b" font-weight="400">Note 01 • entity named</text><text x="52" y="297" font-size="17" fill="#20334b" font-weight="400">Note 02 • phone recorded</text><rect x="46" y="310" width="235" height="54" rx="12" fill="#e4eefb" stroke="#9bb9e0"/><text x="60" y="344" font-size="18" fill="#20334b" font-weight="700">Note 03 • reading</text><text x="52" y="403" font-size="18" fill="#20334b" font-weight="400">Entities in this claim</text><text x="52" y="439" font-size="18" fill="#20334b" font-weight="400">Northstar Clinic</text><text x="52" y="475" font-size="18" fill="#20334b" font-weight="400">Ada Monroe</text><text x="52" y="552" font-size="16" fill="#526881" font-weight="400">Switch notes without</text><text x="52" y="577" font-size="16" fill="#526881" font-weight="400">creating the entity again.</text><rect x="312" y="190" width="580" height="490" rx="12" fill="#ffffff" stroke="#d4ddea"/><text x="336" y="226" font-size="22" fill="#20334b" font-weight="700">Original note • Note 03</text><text x="336" y="277" font-size="19" fill="#20334b" font-weight="400">The note includes an address with no owner:</text><rect x="336" y="299" width="246" height="43" rx="5" fill="#fff0ba" stroke="#e4cb71"/><text x="348" y="328" font-size="22" fill="#20334b" font-weight="700">“27 Pine Avenue.”</text><text x="336" y="384" font-size="18" fill="#20334b" font-weight="400">Select the exact words.</text><text x="336" y="416" font-size="18" fill="#20334b" font-weight="400">Choose Detail → Street address.</text><text x="336" y="448" font-size="18" fill="#20334b" font-weight="400">The source stays attached to the saved value.</text><rect x="336" y="516" width="530" height="131" rx="12" fill="#eff5fa" stroke="#d4ddea"/><text x="354" y="549" font-size="18" fill="#20334b" font-weight="400">Do not guess an owner.</text><text x="354" y="578" font-size="18" fill="#20334b" font-weight="400">This typed address remains available for review,</text><text x="354" y="607" font-size="18" fill="#20334b" font-weight="400">even though it is outside the initial benchmark.</text><rect x="908" y="190" width="500" height="490" rx="12" fill="#ffffff" stroke="#d4ddea"/><text x="932" y="226" font-size="22" fill="#20334b" font-weight="700">Capture detail</text><text x="932" y="270" font-size="16" fill="#526881" font-weight="400">Type</text><rect x="932" y="284" width="450" height="45" rx="12" fill="#ffffff" stroke="#d4ddea"/><text x="946" y="314" font-size="18" fill="#20334b" font-weight="400">Street address</text><text x="932" y="359" font-size="16" fill="#526881" font-weight="400">Value from note</text><rect x="932" y="374" width="450" height="45" rx="12" fill="#ffffff" stroke="#d4ddea"/><text x="946" y="404" font-size="18" fill="#20334b" font-weight="400">27 Pine Avenue</text><text x="932" y="451" font-size="16" fill="#526881" font-weight="400">Owner</text><rect x="932" y="465" width="450" height="45" rx="12" fill="#fff7de" stroke="#e4cb71"/><text x="946" y="495" font-size="18" fill="#20334b" font-weight="700">Owner not established</text><text x="932" y="546" font-size="16" fill="#20334b" font-weight="400">Reason: no supporting context in this claim.</text><text x="932" y="572" font-size="16" fill="#20334b" font-weight="400">A later assignment keeps this original decision.</text><rect x="932" y="600" width="450" height="51" rx="12" fill="#1a6b6a" stroke="#1a6b6a"/><text x="1025" y="633" font-size="19" fill="#ffffff" font-weight="700">Save unassigned detail</text><rect x="32" y="704" width="1376" height="192" rx="12" fill="#ffffff" stroke="#d4ddea"/><text x="54" y="741" font-size="23" fill="#20334b" font-weight="700">Claim dossier • review across all notes</text><text x="54" y="782" font-size="19" fill="#20334b" font-weight="400">Northstar Clinic → phone 312-555-0101 → evidence in Notes 01 and 02</text><text x="54" y="816" font-size="19" fill="#20334b" font-weight="400">Unassigned details → address 27 Pine Avenue → evidence in Note 03</text><text x="54" y="864" font-size="17" fill="#526881" font-weight="400">Later review: resolve ownership or compare proposed identities across claims; original evidence remains linked.</text></g></svg>