<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1030" viewBox="0 0 1500 1030" role="img" aria-labelledby="title desc"><title id="title">From claim evidence to attribute precision and recall</title><desc id="desc">Fictional example. Three source passages establish two SME clinic facts. GOKO returns the correct clinic phone and places the clinic address on a lawyer. One of two facts matches: attribute precision and recall are 50 percent. Both values are present in evidence, so value precision is 100 percent.</desc><rect width="100%" height="100%" fill="#f4f7fb"/><g font-family="Segoe UI, Arial, sans-serif"><text x="32" y="46" font-size="30" fill="#20334b" font-weight="700">How words in notes become comparison counts</text><text x="32" y="79" font-size="17" fill="#526881" font-weight="400">Fictional example • one claim • two clinic details • GOKO and SME entities associated before detail comparison</text><rect x="32" y="106" width="448" height="499" rx="12" fill="#ffffff" stroke="#d4ddea"/><rect x="526" y="106" width="448" height="499" rx="12" fill="#ffffff" stroke="#d4ddea"/><rect x="1020" y="106" width="448" height="499" rx="12" fill="#ffffff" stroke="#d4ddea"/><text x="54" y="145" font-size="24" fill="#20334b" font-weight="700">1  Source notes</text><text x="54" y="184" font-size="16" fill="#526881" font-weight="400">All passages remain available as evidence.</text><rect x="54" y="207" width="404" height="93" rx="12" fill="#eff5fa" stroke="#d4ddea"/><text x="70" y="236" font-size="19" fill="#20334b" font-weight="400">Note 01</text><text x="70" y="267" font-size="19" fill="#20334b" font-weight="400">“Clinic phone: 312-555-0101.”</text><rect x="54" y="319" width="404" height="93" rx="12" fill="#eff5fa" stroke="#d4ddea"/><text x="70" y="348" font-size="19" fill="#20334b" font-weight="400">Note 02</text><text x="70" y="379" font-size="19" fill="#20334b" font-weight="400">“Clinic phone: 312-555-0101.”</text><rect x="54" y="431" width="404" height="93" rx="12" fill="#eff5fa" stroke="#d4ddea"/><text x="70" y="460" font-size="19" fill="#20334b" font-weight="400">Note 03</text><text x="70" y="491" font-size="19" fill="#20334b" font-weight="400">“Clinic address: 14 Cedar Lane.”</text><text x="54" y="568" font-size="21" fill="#20334b" font-weight="700">3 passages ≠ 3 distinct details</text><text x="548" y="145" font-size="24" fill="#20334b" font-weight="700">2  SME claim dossier</text><text x="548" y="184" font-size="16" fill="#526881" font-weight="400">The SME confirms both details belong to:</text><text x="548" y="213" font-size="21" fill="#20334b" font-weight="700">Northstar Clinic</text><rect x="548" y="241" width="404" height="118" rx="12" fill="#e4f3ed" stroke="#8fbdad"/><text x="566" y="274" font-size="19" fill="#20334b" font-weight="400">Gold fact A • clinic phone</text><text x="566" y="303" font-size="19" fill="#20334b" font-weight="400">312-555-0101</text><text x="566" y="332" font-size="19" fill="#20334b" font-weight="400">Supported by Notes 01 and 02</text><rect x="548" y="382" width="404" height="118" rx="12" fill="#e4f3ed" stroke="#8fbdad"/><text x="566" y="415" font-size="19" fill="#20334b" font-weight="400">Gold fact B • clinic address</text><text x="566" y="444" font-size="19" fill="#20334b" font-weight="400">14 Cedar Lane</text><text x="566" y="473" font-size="19" fill="#20334b" font-weight="400">Supported by Note 03</text><text x="548" y="568" font-size="21" fill="#20334b" font-weight="700">G_F = 2 SME-confirmed facts</text><text x="1042" y="145" font-size="24" fill="#20334b" font-weight="700">3  GOKO extraction</text><text x="1042" y="184" font-size="16" fill="#526881" font-weight="400">Compare owner + detail type + value.</text><rect x="1042" y="207" width="404" height="149" rx="12" fill="#e4f3ed" stroke="#8fbdad"/><text x="1060" y="242" font-size="19" fill="#20334b" font-weight="400">Northstar Clinic • phone</text><text x="1060" y="276" font-size="19" fill="#20334b" font-weight="400">312-555-0101</text><text x="1060" y="310" font-size="19" fill="#20334b" font-weight="400">Matches gold fact A → count 1</text><rect x="1042" y="382" width="404" height="149" rx="12" fill="#fff0e8" stroke="#d6a690"/><text x="1060" y="417" font-size="19" fill="#20334b" font-weight="400">Lawyer • address</text><text x="1060" y="451" font-size="19" fill="#20334b" font-weight="400">14 Cedar Lane</text><text x="1060" y="485" font-size="19" fill="#20334b" font-weight="400">Wrong owner → count 0</text><text x="1042" y="568" font-size="20" fill="#20334b" font-weight="700">S_F = 2 returned facts; M_F = 1</text><rect x="32" y="632" width="1436" height="214" rx="12" fill="#173954" stroke="#173954"/><text x="58" y="674" font-size="24" fill="#ffffff" font-weight="700">4  Calculate after SME reference and comparison decisions are complete</text><text x="58" y="723" font-size="22" fill="#ffffff" font-weight="400">Attribute precision = correct GOKO facts / GOKO facts = 1 / 2 = 50%</text><text x="58" y="765" font-size="22" fill="#ffffff" font-weight="400">Attribute recall = gold facts recovered / gold facts = 1 / 2 = 50%</text><text x="58" y="807" font-size="22" fill="#ffffff" font-weight="400">Value precision = values present in claim / returned values = 2 / 2 = 100%</text><rect x="32" y="873" width="1436" height="119" rx="12" fill="#ffffff" stroke="#d4ddea"/><text x="54" y="907" font-size="18" fill="#20334b" font-weight="400">Why the counts differ: the address text is supported, but GOKO assigned it to the wrong entity.</text><text x="54" y="938" font-size="18" fill="#20334b" font-weight="400">The repeated phone passage supplies additional evidence, not a second phone fact.</text><text x="54" y="969" font-size="18" fill="#20334b" font-weight="400">Only these two details are illustrated. Unknown-owner details stay outside the initial benchmark.</text></g></svg>